<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>色彩用語クイズ（全127問）</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #cbd5e1;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 18px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
      text-align: center;
    }

    .setup-group {
      margin: 18px 0;
      text-align: center;
    }

    .setup-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .count-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .count-btn {
      padding: 8px 14px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .count-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .primary-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
    }

    .secondary-btn {
      display: inline-block;
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .secondary-btn:hover {
      background: #f8fafc;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .score-live {
      font-weight: 700;
      color: var(--text);
    }

    .question-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .q-text {
      font-size: 1rem;
      line-height: 1.55;
      font-weight: 600;
      margin: 0;
    }

    /* 常に横2列×縦5行（10択）で表示 */
    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .choice-btn {
      padding: 9px 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.86rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      line-height: 1.25;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .choice-btn:disabled {
      cursor: default;
    }

    .choice-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .choice-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .feedback {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback.ok {
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .feedback.ng {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .next-wrap {
      margin-top: 10px;
    }

    .score-big {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin: 14px 0;
      line-height: 1.35;
    }

    .review-list {
      margin-top: 16px;
      text-align: left;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }

    .review-item {
      padding: 9px 11px;
      border-radius: 8px;
      background: #f8fafc;
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>色彩用語クイズ（全127問・10択）</h1>

    <div id="start-screen">
      <p style="color: var(--muted); line-height: 1.6; text-align: center; margin: 0; font-size: 0.92rem;">
        修正版・全127問の色彩用語クイズです。<br />
        出題順・選択肢順ともに毎回ランダムにシャッフルされます。
      </p>

      <div class="setup-group">
        <span class="setup-label">出題数を選択</span>
        <div class="count-options" id="count-options">
          <button type="button" class="count-btn active" data-count="10">10問</button>
          <button type="button" class="count-btn" data-count="25">25問</button>
          <button type="button" class="count-btn" data-count="50">50問</button>
          <button type="button" class="count-btn" data-count="127">全127問</button>
        </div>
      </div>

      <button type="button" class="primary-btn" id="start-btn">クイズを開始する</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="meta-bar">
        <span id="progress-text">第 1 / 10 問</span>
        <span class="score-live" id="score-live">正解: 0 / 0問 (0.0%)</span>
      </div>

      <div class="question-box">
        <p class="q-text" id="q-text"></p>
      </div>

      <div class="choices" id="choices-box"></div>
      <div class="feedback hidden" id="feedback-box"></div>

      <div class="next-wrap">
        <button type="button" class="primary-btn hidden" id="next-btn">次の問題へ</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <h2 style="text-align: center; margin: 6px 0 0; font-size: 1.2rem;">結果発表</h2>
      <div class="score-big" id="final-score"></div>
      <button type="button" class="primary-btn" id="retry-all-btn">もう一度挑戦する</button>
      <button type="button" class="secondary-btn hidden" id="retry-wrong-btn">間違えた問題だけ復習する</button>
      <div class="review-list hidden" id="review-list"></div>
    </div>
  </div>
