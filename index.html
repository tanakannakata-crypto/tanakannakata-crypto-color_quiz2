<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>色彩用語クイズ（全127問）</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #cbd5e1;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 18px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
      text-align: center;
    }

    .setup-group {
      margin: 18px 0;
      text-align: center;
    }

    .setup-label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .count-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .count-btn {
      padding: 8px 14px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .count-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .primary-btn {
      display: inline-block;
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
    }

    .secondary-btn {
      display: inline-block;
      width: 100%;
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .secondary-btn:hover {
      background: #f8fafc;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .score-live {
      font-weight: 700;
      color: var(--text);
    }

    .question-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .q-text {
      font-size: 1rem;
      line-height: 1.55;
      font-weight: 600;
      margin: 0;
    }

    /* 常に横2列×縦5行（10択）で表示 */
    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .choice-btn {
      padding: 9px 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 0.86rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      line-height: 1.25;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .choice-btn:disabled {
      cursor: default;
    }

    .choice-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .choice-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .feedback {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      text-align: center;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback.ok {
      background: var(--correct-bg);
      color: var(--correct-text);
    }

    .feedback.ng {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }

    .next-wrap {
      margin-top: 10px;
    }

    .score-big {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin: 14px 0;
      line-height: 1.35;
    }

    .review-list {
      margin-top: 16px;
      text-align: left;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }

    .review-item {
      padding: 9px 11px;
      border-radius: 8px;
      background: #f8fafc;
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>色彩用語クイズ（全127問・10択）</h1>

    <div id="start-screen">
      <p style="color: var(--muted); line-height: 1.6; text-align: center; margin: 0; font-size: 0.92rem;">
        修正版・全127問の色彩用語クイズです。<br />
        出題順・選択肢順ともに毎回ランダムにシャッフルされます。
      </p>

      <div class="setup-group">
        <span class="setup-label">出題数を選択</span>
        <div class="count-options" id="count-options">
          <button type="button" class="count-btn active" data-count="10">10問</button>
          <button type="button" class="count-btn" data-count="25">25問</button>
          <button type="button" class="count-btn" data-count="50">50問</button>
          <button type="button" class="count-btn" data-count="127">全127問</button>
        </div>
      </div>

      <button type="button" class="primary-btn" id="start-btn">クイズを開始する</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="meta-bar">
        <span id="progress-text">第 1 / 10 問</span>
        <span class="score-live" id="score-live">正解: 0 / 0問 (0.0%)</span>
      </div>

      <div class="question-box">
        <p class="q-text" id="q-text"></p>
      </div>

      <div class="choices" id="choices-box"></div>
      <div class="feedback hidden" id="feedback-box"></div>

      <div class="next-wrap">
        <button type="button" class="primary-btn hidden" id="next-btn">次の問題へ</button>
      </div>
    </div>

    <div id="result-screen" class="hidden">
      <h2 style="text-align: center; margin: 6px 0 0; font-size: 1.2rem;">結果発表</h2>
      <div class="score-big" id="final-score"></div>
      <button type="button" class="primary-btn" id="retry-all-btn">もう一度挑戦する</button>
      <button type="button" class="secondary-btn hidden" id="retry-wrong-btn">間違えた問題だけ復習する</button>
      <div class="review-list hidden" id="review-list"></div>
    </div>
  </div>

      { id: 100, q: "スペイン産の大粒の栗の名前に由来する色は？", a: "マルーン" },
      { id: 101, q: "イタリア語で「焼いた土」を意味し、素焼きの陶器などの色合いを指す色は？", a: "テラコッタ" },
      { id: 102, q: "イタリアのトスカナ地方の中心都市の土に由来する色は？", a: "バーントシェンナ" },
      { id: 103, q: "美しい土の採掘場として昔から有名なイタリア・トスカナ地方の中心都市にちなんで名づけられた土を原料とし、フレスコ画に重要な「そのまま」の絵の具に由来する色は？", a: "ローシェンナ" },
      { id: 104, q: "「さらしていない」、「生の」＋「未加工の羊毛のような」色は？", a: "エクルベイジュ" },
      { id: 105, q: "琥珀のような色は？", a: "アンバー" },
      { id: 106, q: "そのまま＋ウンブリア地方の土という意味で、英米では家の壁によく用いられる色は？", a: "ローアンバー" },
      { id: 107, q: "ナポリの黄という意味で、ヴェスヴィアス火山の鉱物から作られたと信じられていた色は？", a: "ネープルスイエロー" },
      { id: 108, q: "カシやナラなどの樹皮から採取した液で獣皮をなめす際に使われる「なめし革」に由来する色は？", a: "タン" },
      { id: 109, q: "ルネッサンス期の盛期に聖人を表す光輪に使われた色は？", a: "ゴールデンイエロー" },
      { id: 110, q: "イタリア・ウンブリア地方の土を焼いてつくられた絵の具に由来する色は？", a: "バーントアンバー" },
      { id: 111, q: "フランス語で「輝かしい」という意味を含む色は？", a: "ジョンブリアン" },
      { id: 112, q: "フランスの修道院でつくられたリキュールが起源の色は？", a: "シャルトルーズグリーン" },
      { id: 113, q: "英語の名称としては最古のものの一つで、牧草に由来する色は？", a: "グラスグリーン" },
      { id: 114, q: "ハッカの油からつくった酒に由来する色は？", a: "ミントグリーン" },
      { id: 115, q: "酒の輸送や薬瓶などに関係した色は？", a: "ボトルグリーン" },
      { id: 116, q: "1880年代にエジプトの大河の名を冠して登場した色は？", a: "ナイルブルー" },
      { id: 117, q: "「木の葉」という意味を持つ色は？", a: "リーフグリーン" },
      { id: 118, q: "日本では赤だが、英語ではグリーンの色は？", a: "アップルグリーン" },
      { id: 119, q: "日本語で孔雀石と呼ばれる鉱石からつくられ、古代エジプトでは目を守るまじないとして目のまわりに塗ったことがアイラインの始まりだとされる色は？", a: "マラカイトグリーン" },
      { id: 120, q: "孔雀の羽に由来する色は？", a: "ピーコックグリーン" },
      { id: 121, q: "19世紀に錫酸コバルト化合物からつくられた色は？", a: "セルリアンブルー" },
      { id: 122, q: "ドイツ東部の州であるザクセンの英語名に由来し、「ザクセン人の青」という意味を持ち、藍染めの名称として広く一般に用いられるようになり、主に繊維製品のための色名となった色は？", a: "サックスブルー" },
      { id: 123, q: "ネービーブルーよりも暗い紺系で、20世紀初めに登場した流行色の色は？", a: "ミッドナイトブルー" },
      { id: 124, q: "藤の英語名の色は？", a: "ウイスタリア" },
      { id: 125, q: "花の色からとられた薄紫の色は？", a: "ライラック" },
      { id: 126, q: "西洋諸国で屋根の瓦として使われる粘板岩の薄板に由来する色は？", a: "スレートグレイ" },
      { id: 127, q: "油を燃焼させてできた煤からとられた色は？", a: "ランプブラック" }
    ];

    const ALL_ANSWERS = Array.from(new Set(QUIZ_DATA.map(item => item.a)));

    let selectedCount = 10;
    let sessionQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let answeredCount = 0;
    let wrongItems = [];

    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");

    const countButtons = document.querySelectorAll(".count-btn");
    countButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        countButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedCount = Number(btn.dataset.count);
      });
    });

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildChoices(correctAnswer) {
      const distractors = shuffle(ALL_ANSWERS.filter(ans => ans !== correctAnswer)).slice(0, 9);
      return shuffle([correctAnswer, ...distractors]);
    }

    function formatAccuracy(correct, total) {
      if (total === 0) return "0.0%";
      return `${((correct / total) * 100).toFixed(1)}%`;
    }

    function updateLiveScore() {
      const rate = formatAccuracy(score, answeredCount);
      document.getElementById("score-live").textContent = `正解: ${score} / ${answeredCount}問 (${rate})`;
    }

    function startSession(customPool = null) {
      const pool = customPool ? shuffle(customPool) : shuffle(QUIZ_DATA).slice(0, selectedCount);
      sessionQuestions = pool;
      currentIdx = 0;
      score = 0;
      answeredCount = 0;
      wrongItems = [];

      startScreen.classList.add("hidden");
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      updateLiveScore();
      renderQuestion();
    }

    function renderQuestion() {
      const item = sessionQuestions[currentIdx];
      document.getElementById("progress-text").textContent = `第 ${currentIdx + 1} / ${sessionQuestions.length} 問`;
      updateLiveScore();
      document.getElementById("q-text").textContent = item.q;

      const feedbackBox = document.getElementById("feedback-box");
      const nextBtn = document.getElementById("next-btn");
      feedbackBox.className = "feedback hidden";
      feedbackBox.textContent = "";
      nextBtn.classList.add("hidden");

      const choicesBox = document.getElementById("choices-box");
      choicesBox.innerHTML = "";

      const choices = buildChoices(item.a);
      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";
        btn.textContent = choice;
        btn.addEventListener("click", () => handleAnswer(btn, choice, item));
        choicesBox.appendChild(btn);
      });
    }

    function handleAnswer(clickedBtn, chosen, item) {
      const allBtns = document.querySelectorAll(".choice-btn");
      allBtns.forEach(b => (b.disabled = true));

      answeredCount++;

      const feedbackBox = document.getElementById("feedback-box");
      feedbackBox.classList.remove("hidden");

      if (chosen === item.a) {
        clickedBtn.classList.add("correct");
        score++;
        feedbackBox.className = "feedback ok";
        feedbackBox.textContent = `正解！「${item.a}」`;
      } else {
        clickedBtn.classList.add("wrong");
        wrongItems.push({ ...item, chosen });
        allBtns.forEach(b => {
          if (b.textContent === item.a) {
            b.classList.add("correct");
          }
        });
        feedbackBox.className = "feedback ng";
        feedbackBox.textContent = `不正解 — 正解は「${item.a}」`;
      }

      updateLiveScore();

      const nextBtn = document.getElementById("next-btn");
      nextBtn.textContent = currentIdx + 1 < sessionQuestions.length ? "次の問題へ" : "結果を見る";
      nextBtn.classList.remove("hidden");
    }

    function showResult() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const total = sessionQuestions.length;
      const rate = formatAccuracy(score, total);
      document.getElementById("final-score").textContent = `${total}問中 ${score}問正解（${rate}）`;

      const retryWrongBtn = document.getElementById("retry-wrong-btn");
      const reviewList = document.getElementById("review-list");

      if (wrongItems.length > 0) {
        retryWrongBtn.classList.remove("hidden");
        retryWrongBtn.textContent = `間違えた問題だけ復習する（${wrongItems.length}問）`;
        reviewList.classList.remove("hidden");
        reviewList.innerHTML = wrongItems
          .map(
            w => `
              <div class="review-item">
                ${w.q}<br />
                あなたの回答：<span style="color: var(--wrong-text);">${w.chosen}</span> ／
                正解：<strong style="color: var(--correct-text);">${w.a}</strong>
              </div>
            `
          )
          .join("");
      } else {
        retryWrongBtn.classList.add("hidden");
        reviewList.classList.add("hidden");
        reviewList.innerHTML = "";
      }
    }

    document.getElementById("start-btn").addEventListener("click", () => startSession());
    document.getElementById("retry-all-btn").addEventListener("click", () => {
      resultScreen.classList.add("hidden");
      startScreen.classList.remove("hidden");
    });
    document.getElementById("retry-wrong-btn").addEventListener("click", () => {
      startSession(wrongItems);
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      currentIdx++;
      if (currentIdx < sessionQuestions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    });
  </script>
</body>
