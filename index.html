// 全ての答えのユニークなリスト（ダミー選択肢のプール用）
const allAnswers = Array.from(new Set(allData.map(item => item.a)));

let shuffledQuestions = [];
let currentIndex = 0;
let score = 0;

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    shuffledQuestions = shuffleArray(allData);
    currentIndex = 0;
    score = 0;
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-box').style.display = 'block';
    
    showQuestion();
}

function showQuestion() {
    const currentQ = shuffledQuestions[currentIndex];
    document.getElementById('progress').innerText = `第 ${currentIndex + 1} 問 / 全 ${shuffledQuestions.length} 問`;
    document.getElementById('question-text').innerText = currentQ.q;
    
    // 選択肢作成（正解 1つ ＋ ダミー 9個 ＝ 計10個）
    let choices = [currentQ.a];
    const otherAnswers = allAnswers.filter(ans => ans !== currentQ.a);
    const shuffledOthers = shuffleArray(otherAnswers);
    
    // ダミーから9個追加
    for (let i = 0; i < 9 && i < shuffledOthers.length; i++) {
        choices.push(shuffledOthers[i]);
    }
    
    // 選択肢の順番をシャッフル
    choices = shuffleArray(choices);
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    document.getElementById('feedback').innerText = '';
    document.getElementById('next-btn').style.display = 'none';
    
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = choice;
        btn.onclick = () => selectChoice(btn, choice, currentQ.a);
        container.appendChild(btn);
    });
}

function selectChoice(selectedBtn, selectedChoice, correctAnswer) {
    const buttons = document.querySelectorAll('.choice-btn');
    buttons.forEach(btn => btn.disabled = true);
    
    if (selectedChoice === correctAnswer) {
        selectedBtn.classList.add('correct');
        document.getElementById('feedback').innerText = '正解です！';
        document.getElementById('feedback').style.color = '#16a34a';
        score++;
    } else {
        selectedBtn.classList.add('incorrect');
        document.getElementById('feedback').innerText = `不正解… 正解は「${correctAnswer}」です`;
        document.getElementById('feedback').style.color = '#dc2626';
        
        // 正解のボタンをハイライト
        buttons.forEach(btn => {
            if (btn.innerText === correctAnswer) {
                btn.classList.add('correct');
            }
        });
    }
    
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < shuffledQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('score-display').innerText = `${shuffledQuestions.length}問中 ${score}問正解！`;
}
</script>
